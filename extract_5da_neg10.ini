[extract]
engines = pfind, diann
positive_species_marker = HUMAN
result_file = ./datasets/hela_5da_neg10.json

[engine.pfind]
path = ../pfind-dia/5th/
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.10

[engine.diann]
path = ../diann/hela-01-21-5da-mix.parquet
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.10

[entrapment]
target_fasta = /home/wskong/dia-nn/DIANN_workflow/data/fasta/uniprotkb_Human_AND_reviewed_true_AND_m_2025_12_30.fasta
drop_levels = L0, L1
