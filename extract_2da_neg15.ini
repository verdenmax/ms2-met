[extract]
engines = pfind, diann
positive_species_marker = HUMAN
result_file = ./datasets/hela_2da_neg15.json

[engine.pfind]
path = ../pfind-dia/2th/
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.15

[engine.diann]
path = ../diann/hela-01-22-2da-mix.parquet
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.15

[entrapment]
# 如果远程没有 proteinCopilot 输出，注释掉这个段
target_fasta = ~/share/2026_06_07_kongweisa_guangshan_puku/uniprotkb_proteome_UP000005640_2026_06_10.fasta
drop_levels = L0, L1

[contaminant]
# 污染库过滤：剔除映射到污染蛋白(cRAP)的肽段(正负例都剔)
fasta = ~/share/2026_06_09_kongweisa_lcr_data/contaminant.fasta
# match_li = true   # 默认 true：精确子串(L0) + L↔I 异构(L1) 都判为污染
