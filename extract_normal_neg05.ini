[extract]
engines = pfind, diann
positive_species_marker = HUMAN
result_file = ./datasets/hela_normal_neg05.json

[engine.pfind]
path = ../pfind-dia/normal/
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.05

[engine.diann]
path = ../diann/hela-03-11-normal-mix.parquet
qvalue_threshold = 0.01
negative_qvalue_threshold = 0.05

[entrapment]
target_fasta = /home/wskong/dia-nn/DIANN_workflow/data/fasta/uniprotkb_Human_AND_reviewed_true_AND_m_2025_12_30.fasta
drop_levels = L0, L1
