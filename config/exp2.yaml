data:
  train_files:
    - data/hela_2da_comm_features_all.csv
    - data/hela_5da_comm_features_all.csv
  test_files:
    - data/mix_dinn_features_new.csv
  feature_cols:
    - precursor_mz
    - sequence_len
    - precursor_pearson
    - b_count
    - b_p25
    - b_p50
    - b_p75
    - b_mean
    - y_count
    - y_p50
    - y_p75
    - y_mean
    - all_count
    - all_p25
    - all_p50
    - all_p75
    - all_mean
    - matched_intensity_percent
  target_col: label  # 假设你的标签列叫 'label'

model:
  type: lightgbm  # 选择是什么模型
  params:         # 这个模型的参数
    boosting_type: gbdt
    objective: binary
    metric: [auc, binary_logloss]
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    verbose: -1

training:
  num_boost_round: 1000  # 训练轮数
  early_stopping_rounds: 50
  valid_size: 0.2  # 从训练集中划分验证集（可选）

output:
  model_path: models/exp1.txt
  result_path: results/exp1.json
