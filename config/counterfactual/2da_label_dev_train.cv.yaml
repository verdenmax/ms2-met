# Development-only OOF diagnostics; production thresholds require real errors.
data:
  train_files:
  - runs/counterfactual_2da_label_dev_train/features.csv
  test_files: []
  feature_cols: []
  target_col: label
  feature_arm: ms1_ms2_no_prediction
  drop_features: []
  cohort: evidence_observed
  group_col: peptide_group_id
  require_complete_arm: true
model:
  type: lightgbm
  params:
    boosting_type: gbdt
    objective: binary
    metric:
    - auc
    - binary_logloss
    num_leaves: 15
    learning_rate: 0.02
    feature_fraction: 0.9
    bagging_fraction: 0.8
    min_data_in_leaf: 50
    verbose: -1
    bagging_freq: 1
    seed: 42
    feature_fraction_seed: 42
    bagging_seed: 42
    data_random_seed: 42
    deterministic: true
    force_col_wise: true
training:
  num_boost_round: 2000
  early_stopping_rounds: 200
  valid_size: 0.15
  cv_folds: 5
  cv_seed: 42
  min_class_groups_per_split: 5
  early_stopping_first_metric_only: true
output:
  model_path: runs/counterfactual_2da_label_dev_train/models/cv.txt
  result_path: runs/counterfactual_2da_label_dev_train/training.cv.json
operating_point:
  target_fprs:
  - 0.01
  - 0.05
  - 0.1
  primary_target_fpr: 0.1
evaluation_semantics:
  positive_class: incorrect_identification
  stored_label: 1=correct_identification, 0=incorrect_identification
  model_score: trust_score=P(correct_identification)
  metric_score: error_score=1-trust_score
audit:
  suspect_threshold: 0.9
  suspect_top_n: 200
