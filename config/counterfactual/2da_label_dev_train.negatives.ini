[counterfactual]
dataset_split = label_dev_train
labeling = silac

parents = ./datasets/counterfactual/2da/label_dev_train_prepared_parents.json
require_prepared_parents = true

# Canonical FASTA inputs already used by extract_2da_pfind_diann.ini.
target_fasta = /home/verden/share/2026_06_07_kongweisa_guangshan_puku/uniprotkb_proteome_UP000005640_2026_06_10.fasta
contaminant_fasta = /home/verden/share/2026_06_09_kongweisa_lcr_data/contaminant.fasta

composition_shuffle_per_parent = 2
kr_position_shuffle_per_parent = 2
local_denovo_per_parent = 2
seed = 42
max_attempts_per_source = 500

min_length = 7
max_length = 40
precursor_mass_tolerance_ppm = 20
fragment_mass_tolerance_da = 0.02
min_sequence_difference = 2
min_changed_fragment_positions = 2
require_positive_label = true
require_tryptic_c_terminus = true
exclude_modified = true

local_min_segment_length = 2
local_max_segment_length = 4
local_min_shared_fragment_fraction = 0.5

include_parent_positives = true
output_psms = ./datasets/counterfactual/2da/label_dev_train_counterfactual_psms.json
output_manifest = ./datasets/counterfactual/2da/label_dev_train_counterfactual_manifest.tsv
output_audit = ./datasets/counterfactual/2da/label_dev_train_counterfactual.audit.json
