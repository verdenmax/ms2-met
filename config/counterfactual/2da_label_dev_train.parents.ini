[counterfactual_parents]
# Only Rep1/Rep2 are eligible. Rep3 is reserved by 2da_raw_split.csv and is
# never used to prepare or generate synthetic training rows.
dataset_split = label_dev_train
labeling = silac

input_psms = ./datasets/hela_2da_pfind_diann.json

# Create this reviewed table from the adjacent .csv.example. A positive search
# label alone is not a heavy-confirmation verdict, so this file is deliberately
# not generated or committed by the pipeline.
confirmation_table = ./config/counterfactual/2da_heavy_confirmation.csv
confirmation_column = heavy_confirmed
confirmation_rule = observed_light_heavy_pair_review_v1

raw_split_table = ./config/counterfactual/2da_raw_split.csv

min_length = 7
max_length = 40
require_tryptic_c_terminus = true
exclude_modified = true

output_psms = ./datasets/counterfactual/2da/label_dev_train_prepared_parents.json
output_manifest = ./datasets/counterfactual/2da/label_dev_train_prepared_parents.tsv
output_audit = ./datasets/counterfactual/2da/label_dev_train_prepared_parents.audit.json
