experiment:
  negative_pool_models: [M20]

protocol:
  label_source: >-
    positive=tight cross-engine intersection with HUMAN species marker;
    error=loose cross-engine union with non-HUMAN species marker after
    label-site, contaminant, and configured entrapment filters

preprocessing:
  # Sensitivity arm: same frozen rows/folds/features, but no binary missingness
  # channels. Compare its paired fixed-test result with tabular_mlp.yaml.
  add_missing_indicators: false

model:
  type: tabular_mlp_v1
  hidden_dims: [128, 64]
  dropout: 0.15

training:
  seeds: [42, 43, 44]
  early_stopping_metric: roc_auc
  device: auto
  deterministic: true
  torch_num_threads: 0
  epochs: 60
  batch_size: 2048
  inference_batch_size: 8192
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  patience: 8
  min_delta: 0.0001
  class_weighting: none
  min_class_groups_per_split: 5

comparators:
  logistic_regression:
    enabled: true
    C: 1.0
    max_iter: 300
    solver: lbfgs

comparison:
  bootstrap_reps: 1000
  bootstrap_seed: 20260812

evaluation_semantics:
  positive_class: incorrect_identification
  stored_label: 1=correct_identification, 0=incorrect_identification
  model_score: trust_score=P(correct_identification)
  metric_score: error_score=1-trust_score
