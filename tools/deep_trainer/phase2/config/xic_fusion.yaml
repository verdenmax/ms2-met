schema: phase2_xic_training_config_v1

experiment:
  # M20 is the direct comparison against the strongest controlled LightGBM
  # baseline. M5/M10 can be added without changing the frozen E20 test.
  negative_pool_models: [M20]

model:
  type: xic_fusion_attention_v1
  precursor_channels: 20
  fragment_channels: 10
  trace_hidden_dim: 32
  embedding_dim: 8
  fragment_hidden_dim: 64
  attention_dim: 32
  fusion_hidden_dims: [128, 64]
  max_fragment_ordinal: 256
  max_fragment_charge: 8
  dropout: 0.15
  # This is a predeclared model arm. It can be true only when the immutable
  # XIC dataset was separately built with prediction.include=true.
  include_predicted_intensity: false

training:
  # Three seeds x five frozen outer folds = the formal 15-member ensemble.
  seeds: [42, 43, 44]
  early_stopping_metric: roc_auc
  device: auto
  deterministic: true
  torch_num_threads: 0
  num_workers: 0
  epochs: 50
  batch_size: 128
  inference_batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  patience: 8
  min_delta: 0.0001
  class_weighting: none
  min_class_groups_per_split: 5

comparison:
  bootstrap_reps: 1000
  bootstrap_seed: 20260813

evaluation_semantics:
  positive_class: incorrect_identification
  stored_label: 1=correct_identification, 0=incorrect_identification
  model_score: trust_score=P(correct_identification)
  metric_score: error_score=1-trust_score
