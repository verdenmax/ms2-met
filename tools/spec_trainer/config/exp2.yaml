data:
  train_files:
    - runs/baseline_2da_clean/features.csv
    - runs/baseline_5da_clean/features.csv
  test_files:
    - runs/baseline_2da_clean/features.csv
    - runs/baseline_5da_clean/features.csv
  feature_cols: []
  target_col: label  # 假设你的标签列叫 'label'

model:
  type: lightgbm  # 选择是什么模型
  params:         # 这个模型的参数
    boosting_type: gbdt
    objective: binary
    metric: [auc, binary_logloss]
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    verbose: -1

training:
  num_boost_round: 1000  # 训练轮数
  early_stopping_rounds: 50
  valid_size: 0.2  # 从训练集中划分验证集（可选）

output:
  model_path: runs/spec_trainer/models/exp2.txt
  result_path: runs/spec_trainer/results/exp2.json
