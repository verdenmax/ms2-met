data:
  train_files:
    - runs/baseline_5da_neg20/features.csv
  test_files: []
  test_size: 0.2
  feature_cols: []
  target_col: label

model:
  type: lightgbm
  params:
    boosting_type: gbdt
    objective: binary
    metric: [auc, binary_logloss]
    num_leaves: 15
    learning_rate: 0.02
    feature_fraction: 0.9
    bagging_fraction: 0.8
    min_data_in_leaf: 50
    verbose: -1

training:
  num_boost_round: 1000
  early_stopping_rounds: 200
  valid_size: 0.2

output:
  model_path: runs/spec_trainer/models/in_5da_neg20.txt
  result_path: runs/spec_trainer/results/in_5da_neg20.json
  figures_dir: runs/spec_trainer/figures
