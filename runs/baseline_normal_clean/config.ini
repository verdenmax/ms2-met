
[input]
raw_num = 3
raw_path_1 = /home/wskong/dia-data/hela_Normal_DIA/20190830_HF_ZHW_hela_SILAC_DIA_350_1000_Rep1.mzML
raw_path_2 = /home/wskong/dia-data/hela_Normal_DIA/20190830_HF_ZHW_hela_SILAC_DIA_350_1000_Rep2.mzML
raw_path_3 = /home/wskong/dia-data/hela_Normal_DIA/20190830_HF_ZHW_hela_SILAC_DIA_350_1000_Rep3.mzML

light_result_file = ./datasets/hela_normal_pfind_diann.json
search_engine_type = 0
pfind_qvalue_threshold = 0.01

[general]
feature_type = 0
work_directory = ./workspace
mass_tol_ppm = 10
xic_cycle_window = 6
result_file = ./runs/baseline_normal_clean/features.csv

# 加载 mzML 时是否对 profile 谱图做 centroiding。
# 设为 false 退回旧行为（保留 profile，所有点）。
centroid_enabled = true

# centroid 阈值：单张谱图内 intensity < max * 该比值 的局部极大值丢弃。
# 典型范围 1e-4 ~ 1e-2；推荐 1e-3。
centroid_rel_threshold = 0.001

[speclib]
speclib_dir = ~/share/2026_06_07_kongweisa_guangshan_puku/lib-normal
speclib_fasta = ~/share/2026_06_07_kongweisa_guangshan_puku/merge_human_ecoli_yeast.fasta
speclib_mod = ~/share/2026_06_07_kongweisa_guangshan_puku/modification.ini
