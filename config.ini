
[input]
raw_num = 1
raw_path_1 = ~/share/2026_04_27_kongweisa_diann_ZHOUHUdataset/hela_Normal_DIA/20190830_HF_ZHW_hela_SILAC_DIA_350_1000_Rep1.pfb

light_result_file = ../hela.json
# search_engine_type 取值：
#   0 = 自定义 JSON（来自 tools/extract_common.py 的输出）
#   1 = DIA-NN parquet
#   2 = AlphaDIA parquet
#   3 = pfind .qry.res（可传单文件或目录路径）
search_engine_type = 0
# 仅当 search_engine_type = 3 时生效；pfind 的 FDR (q-value) 阈值
pfind_qvalue_threshold = 0.01

[general]
# 生成特征的模式，0 为相同文件之间进行生成
# 1 为 正常的轻重标进行生成
feature_type = 0

work_directory = ./workspace

mass_tol_ppm = 10

xic_cycle_window = 6

result_file = result.csv

# 加载 mzML 时是否对 profile 谱图做 centroiding。
# 设为 false 退回旧行为（保留 profile，所有点）。
centroid_enabled = true

# centroid 阈值：单张谱图内 intensity < max * 该比值 的局部极大值丢弃。
# 典型范围 1e-4 ~ 1e-2；推荐 1e-3。
centroid_rel_threshold = 0.001

[speclib]
speclib_dir = ~/share/2026_06_07_kongweisa_guangshan_puku/lib-normal
speclib_fasta = ~/share/2026_06_07_kongweisa_guangshan_puku/merge_human_ecoli_yeast.fasta
speclib_mod = ~/share/2026_06_07_kongweisa_guangshan_puku/modification.ini
